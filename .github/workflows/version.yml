name: Update release PR

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  version:
    name: Update release PR
    if: github.repository == 'convex/templates' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - run: npm ci --ignore-scripts
        working-directory: create-convex
      - name: Check whether a version PR is needed
        id: mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          cwd: create-convex
      - name: Check main is still at this run's commit
        if: steps.mode.outputs.mode == 'version'
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$main_sha" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping release PR update: main has moved beyond this run's commit."
          fi
      - name: Create or update the release PR
        if: steps.mode.outputs.mode == 'version' &&
          steps.freshness.outputs.current == 'true'
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          cwd: create-convex
          script: npm run version-packages
          github-token: ${{ github.token }}
          pr-title: "Prepare next release"
          commit-message: "Version packages"
          pr-base-branch: main

  tag:
    name: Tag a new version
    if: github.repository == 'convex/templates' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: create-convex
    permissions:
      contents: write # create the version tag
      actions: write # start Release on the new tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Tag the commit that set an unreleased version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name=$(jq -r .name package.json)
          version=$(jq -r .version package.json)
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists"
            exit 0
          fi
          if out=$(npm view "$name@$version" version 2>&1); then
            echo "$name@$version is already on npm"
            exit 0
          fi
          grep -q E404 <<<"$out" || { echo "$out" >&2; exit 1; }
          # The newest first-parent commit whose parent had another version set this one.
          for commit in $(git rev-list --first-parent HEAD -- package.json); do
            previous=$(git show "$commit^1:./package.json" 2>/dev/null | jq -r .version || true)
            [[ "$previous" == "$version" ]] || break
          done
          # Tags pushed with GITHUB_TOKEN don't trigger workflows, so start Release on the tag.
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$commit" >/dev/null
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$tag"
          echo "Tagged $commit as $tag and started Release" >> "$GITHUB_STEP_SUMMARY"
