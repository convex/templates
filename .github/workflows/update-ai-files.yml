name: Update AI files

on:
  workflow_dispatch: # manual trigger
  schedule:
    - cron: "0 20 * * 1-5" # every weekday 20:00 UTC
  pull_request:
    paths:
      - .github/workflows/update-ai-files.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  update-ai-files:
    name: Regenerate AI files and open a PR
    runs-on: ubuntu-latest
    steps:
      # A GitHub App token (rather than the default GITHUB_TOKEN) is used so that
      # the PR it opens triggers other workflows (e.g. CI). PRs created with the
      # default GITHUB_TOKEN do not trigger `pull_request` workflows.
      - name: Generate GitHub App token
        id: app-token
        if: github.event_name != 'pull_request'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.TEMPLATES_CI_APP_ID }}
          private-key: ${{ secrets.TEMPLATES_CI_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Regenerate AI files
        run: just update-ai-files

      - name: Create PR if changed
        id: create-pr
        if: github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: github-actions/update-ai-files
          delete-branch: true
          base: main
          commit-message: "Update AI files in templates"
          title: "Update AI files in templates"
          reviewers: Nicolapps
          body: |
            Automated update of Convex AI files in the templates, generated by
            the scheduled `Update AI files` workflow (`just update-ai-files`).

      # The review requested above is informational: `main` has no required
      # reviewers, so auto-merge lands the PR as soon as CI passes.
      - name: Enable auto-merge
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh pr merge --auto --squash "${{ steps.create-pr.outputs.pull-request-number }}"
