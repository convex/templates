name: Release

on:
  push:
    tags: ["v*"]
  # Started on a tag by the version workflow, or by hand to retry a tag.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  queue: max
  cancel-in-progress: false

permissions: {}

env:
  NODE_VERSION: "24.22.1"

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: create-convex
    outputs:
      name: ${{ steps.release.outputs.name }}
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
      artifact_id: ${{ steps.pack.outputs.artifact-id }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - id: release
        uses: convex/release-actions/validate-tag@89da82807c5dce6bb46b4d5397eb17fc65c22b3a # v0.1.0
        with:
          working-directory: create-convex
      - run: npm ci
      - uses: convex/release-actions/check-release-notes@89da82807c5dce6bb46b4d5397eb17fc65c22b3a # v0.1.0
        with:
          working-directory: create-convex
      - run: npm run build
      - run: npm run check
      - id: pack
        uses: convex/release-actions/pack@89da82807c5dce6bb46b4d5397eb17fc65c22b3a # v0.1.0
        with:
          working-directory: create-convex

  stage:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: convex/release-actions/stage@89da82807c5dce6bb46b4d5397eb17fc65c22b3a # v0.1.0
        with:
          artifact-id: ${{ needs.build.outputs.artifact_id }}
          sha256: ${{ needs.build.outputs.sha256 }}
          name: ${{ needs.build.outputs.name }}
          version: ${{ needs.build.outputs.version }}
          channel: ${{ needs.build.outputs.channel }}
          node-version: ${{ env.NODE_VERSION }}
